<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf8" />
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}
      })();
    </script>
    <title>ObjToSchematic</title>
    <meta
      name="description"
      content="Convert 3D models into Minecraft formats such as .schematic, .litematic, .schem, and .nbt."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="ObjToSchematic" />
    <meta
      property="og:description"
      content="Convert 3D models into Minecraft formats such as .schematic, .litematic, .schem, and .nbt."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://objtoschematic.com/" />
    <meta property="og:image" content="https://i.imgur.com/TwdIpyb.png" />
  </head>
  <body>
    <div class="content">
      <div class="split column-sidebar">
        <div class="split column-properties" id="properties"></div>
        <div class="split column-console" id="console">
        </div>
      </div>
      <div class="split column-canvas" id="col-canvas">
        <canvas id="canvas"></canvas>
        <div class="toolbar" id="toolbar"></div>
      </div>
    </div>
  </body>
</html>
